# Захисний зворотний проксі перед Juice Shop (СР №1, ремедіації F-03, F-07..F-10, A09)
# Запуск: nginx -p /home/ubuntu/sr1/hardening -c nginx.conf
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log warn;
events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    server_tokens off;                                   # F-10: не розкривати версію nginx
    client_body_temp_path logs/tmp; proxy_temp_path logs/tmp;
    fastcgi_temp_path logs/tmp; uwsgi_temp_path logs/tmp; scgi_temp_path logs/tmp;

    # A09: структурований журнал доступу (JSON) для моніторингу та алертів
    log_format json escape=json '{"ts":"$time_iso8601","ip":"$remote_addr","method":"$request_method",'
        '"uri":"$uri","status":$status,"bytes":$body_bytes_sent,"rt":$request_time,"ua":"$http_user_agent"}';
    access_log logs/access.jsonl json;

    # F-07: обмеження частоти входу (5 спроб/хв з однієї IP, запас 3)
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:10m rate=50r/s;
    limit_req_status 429;

    map $http_origin $cors_ok { default ""; "https://localhost:8443" $http_origin; }

    upstream juice { server 127.0.0.1:3001; keepalive 16; }

    server {                                             # HTTP → HTTPS
        listen 127.0.0.1:8088;
        return 301 https://localhost:8443$request_uri;
    }

    server {
        listen 127.0.0.1:8443 ssl http2;
        ssl_certificate     certs/server.crt;
        ssl_certificate_key certs/server.key;
        ssl_protocols TLSv1.2 TLSv1.3;                   # A04: лише сучасні версії TLS
        ssl_ciphers ECDHE+AESGCM:ECDHE+CHACHA20;
        ssl_prefer_server_ciphers on;

        # F-10: заголовки безпеки
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-2ADpmZIga9zdrCfzZ7IWyavasltpcKCkxomklfMTCG0=' 'sha256-LMY6wYoFV9I4wWzxaq1N/dTpl4iurQktw706UCHK3vM='; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' wss://localhost:8443; frame-src 'none'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self)" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Access-Control-Allow-Origin $cors_ok always;   # F-10: CORS лише для власного origin
        add_header Vary Origin always;

        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header X-Recruiting;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Feature-Policy;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-Content-Type-Options;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_http_version 1.1;
        proxy_set_header Connection "";

        # F-03: загальна сторінка помилки замість деталей бекенду
        proxy_intercept_errors on;
        error_page 500 502 503 504 = @err;
        location @err { default_type application/json; return 500 '{"error":"Internal error"}'; }

        # F-08, F-09: закрити службові та конфіденційні ресурси
        location ~* ^/(ftp|support/logs|encryptionkeys|metrics|api-docs|infrastructure|\.well-known/(?!security\.txt)) {
            default_type application/json; return 403 '{"error":"Forbidden"}';
        }

        location = /rest/user/login { limit_req zone=login burst=3 nodelay; proxy_pass http://juice; }
        location /socket.io/ {
            proxy_pass http://juice; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade";
        }
        location / { limit_req zone=api burst=200 nodelay; proxy_pass http://juice; }
    }
}
